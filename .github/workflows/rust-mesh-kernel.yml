name: Rust mesh kernel checks
on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-mesh-kernel.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-mesh-kernel.yml'
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run native geometry tests
        working-directory: rust/mesh-kernel
        run: cargo test
      - name: Build WebAssembly module
        working-directory: rust/mesh-kernel
        run: cargo build --release --target wasm32-unknown-unknown
