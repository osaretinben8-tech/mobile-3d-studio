[package]
name = "mobile-3d-mesh-kernel"
version = "0.1.0"
edition = "2021"
description = "Topology-aware mesh operations for Mobile 3D Studio"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
